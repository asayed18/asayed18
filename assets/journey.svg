  <style>
    .title { font: 600 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill: #a1a1aa; letter-spacing: 3px; }
    .sign { font: 700 12px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill: #fff; }
    .role { font: 600 12px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill: #fff; }
    .period { font: 400 11px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill: #a1a1aa; }
    .lit { animation: flicker 6s ease-in-out infinite; }
    .star { animation: twinkle 4s ease-in-out infinite; }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .up { animation: fade .8s ease-out both; }
    .beacon { animation: blink 1.6s ease-in-out infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 1.6s ease-out infinite; }
    .car { animation: drive 7s cubic-bezier(.45,0,.2,1) infinite; }
    @keyframes flicker { 0%,100% { opacity: .95; } 40% { opacity: .55; } 45% { opacity: .15; } 55% { opacity: .85; } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .8; } }
    @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 50% { opacity: .3; } }
    @keyframes ping { from { transform: scale(1); opacity: .8; } to { transform: scale(4); opacity: 0; } }
    @keyframes drive { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 85% { transform: translateX(672px); opacity: 1; } 100% { transform: translateX(672px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
